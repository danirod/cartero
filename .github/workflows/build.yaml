on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
name: Build
jobs:
  flake:
    strategy:
      matrix:
        platform:
          - runs-on: ubuntu-latest
            name: x86_64
          - runs-on: ubuntu-24.04-arm
            name: aarch64
      fail-fast: false
    runs-on: ${{ matrix.platform.runs-on }}
    name: "Flake ${{ matrix.platform.name }}"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build
      - run: nix flake check
  windows:
    strategy:
      matrix:
        platform:
          - runs-on: windows-latest
            name: x64
            msystem: ucrt64
          - runs-on: windows-11-arm
            name: arm64
            msystem: clangarm64
      fail-fast: false
    runs-on: ${{ matrix.platform.runs-on }}
    name: "Windows ${{ matrix.platform.name }}"
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          git
        pacboy: >-
          blueprint-compiler
          desktop-file-utils
          gcc
          gettext
          gtk4
          gtksourceview5
          jq
          libadwaita
          librsvg
          libxml2
          meson
          pkgconf
          rust
        msystem: ${{ matrix.platform.msystem }}
    - uses: actions/checkout@v4
    - name: Generate version code
      id: version-code
      run: |
        echo "CARTERO_NIGHTLY_VERSION=1" >> $GITHUB_ENV
        echo "version=$(build-aux/gen-version.py --nightly)" >> $GITHUB_OUTPUT
        echo "full-version=$(build-aux/gen-version.py --nightly)-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
    - name: Build Windows version
      run: |
        meson setup build -Dprofile=development -Ddecorations=no-csd -Dwin32-bundle=enabled --prefix=\\
        DESTDIR=$PWD/build/cartero-win32 ninja -C build install
    - uses: actions/upload-artifact@v4
      name: Upload Windows version
      with:
        name: cartero-${{ steps.version-code.outputs.full-version }}-windows-${{ matrix.platform.name }}
        path: |
          build/cartero-win32/bin
          build/cartero-win32/lib
          build/cartero-win32/share
