name: Build artifacts
on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign the release
        type: boolean
      profile:
        description: Build profile
        type: choice
        required: true
        options:
          - stable
          - nightly
      appupdater:
        description: Enable the AppUpdater feature for the supported targets
        type: choice
        required: true
        options:
          - enabled
          - disabled
  workflow_call:
    inputs:
      sign:
        type: boolean
        description: Sign the release
      profile:
        type: string
        description: Build profile (stable or nightly)
        required: false
        default: 'nightly'
      appupdater:
        description: Enable the AppUpdater feature for the supported targets
        type: string
        required: false
        default: 'disabled'

run-name: "Build artifacts (profile=${{ inputs.profile }}; appupdater=${{ inputs.appupdater }}; sign=${{ inputs.sign }})"
jobs:
  # Generates a static tarball. We use this instead of the repo for the nightly
  # builds because of the version priming and because we have to test the
  # dist tarballs anyway.
  tarball:
    name: Compile tarball
    runs-on: ubuntu-latest
    steps:
      # required because cement-version.sh requires at least meson 1.4.0
      - name: Upgrade meson
        run: pip install meson
      - name: Clone code
        uses: actions/checkout@v4
      - name: Set build environment
        run: |
          if [ "${{ inputs.profile }}" == "nightly" ]; then
            echo "Will build in nightly mode"
            echo 'CARTERO_NIGHTLY_VERSION=1' >> $GITHUB_ENV
          else
            echo "Will build in stable mode"
          fi
      - name: Generate version code
        id: version-code
        run: echo "version=$(build-aux/gen-version.py)" | tee -a $GITHUB_OUTPUT
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install --no-install-recommends -y desktop-file-utils gettext libadwaita-1-dev libgtk-4-dev libgtksourceview-5-dev meson
      - name: Setup project
        run: meson setup build
      - name: Build dist
        run: meson dist -C build --no-tests
      - name: Upload dist
        uses: actions/upload-artifact@v6
        id: upload-dist
        with:
          name: dist
          path: build/meson-dist/*.tar.xz
          compression-level: 0
    outputs:
      version: ${{ steps.version-code.outputs.version }}
      dist: cartero-${{ steps.version-code.outputs.version }}.tar.xz
      artifact-id: ${{ steps.upload-dist.outputs.artifact-id }}

  # A side action to compile the jhb working dir and cache it.
  macos-jhb:
    strategy:
      matrix:
        platform:
          - runs-on: macos-15-intel
            name: x64
          - runs-on: macos-26
            name: arm64
      fail-fast: false
    name: "Prepare macOS ${{ matrix.platform.name }} buildenv"
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch jhbuild
        id: cache-jhbuild
        uses: actions/cache/restore@v4
        with:
          path: /Users/Shared/work
          key: jhb-${{ matrix.platform.name }}-49.3
          lookup-only: true
      - name: Compile jhbuild
        if: ${{ steps.cache-jhbuild.outputs.cache-hit != 'true' }}
        run: packaging/macos/jhbuild/main.sh
      - name: Cache jhbuild
        if: ${{ steps.cache-jhbuild.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /Users/Shared/work
          key: jhb-${{ matrix.platform.name }}-49.3

  # Cache SimplySign for the Windows version. You might notice that we cache the
  # same file in both runners. This is because there is no SimplySignDesktop
  # for ARM, yet the ARM build runner will not be able to fetch a cache made
  # from an x64 runner, for some reason.
  win32-simplysign:
    strategy:
      matrix:
        platform:
          - runs-on: windows-latest
            name: x64
          - runs-on: windows-11-arm
            name: arm64
    runs-on: ${{ matrix.platform.runs-on }}
    name: "Pre-cache SimplySign ${{ matrix.platform.name }}"
    steps:
      - name: Check cache
        id: cache-simplysign
        uses: actions/cache/restore@v4
        with:
          key: windows-simplysign-${{ matrix.platform.name }}-9.3.4.72
          path: "*.msi"
          lookup-only: true
      - name: Fetch installer
        if: ${{ steps.cache-simplysign.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: Invoke-WebRequest -Uri 'https://files.certum.eu/software/SimplySignDesktop/Windows/9.3.4.72/SimplySignDesktop-9.3.4.72-64-bit-en.msi' -OutFile 'SimplySignDesktop-9.3.4.72-64-bit-en.msi'
      - name: Cache installer
        if: ${{ steps.cache-simplysign.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "*.msi"
          key: windows-simplysign-${{ matrix.platform.name }}-9.3.4.72

  # The main compilation pipeline for macOS
  macos-dmg:
    needs: [tarball, macos-jhb]
    strategy:
      matrix:
        platform:
          - runs-on: macos-15-intel
            name: x64
          - runs-on: macos-26
            name: arm64
      fail-fast: false
    name: "macOS DMG ${{ matrix.platform.name }}"
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Fetch dist
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.tarball.outputs.artifact-id }}
      - name: Extract dist
        run: tar -xf ${{ needs.tarball.outputs.dist }} --strip-components=1
      - name: Fetch jhbuild
        id: cache-jhbuild
        uses: actions/cache/restore@v4
        with:
          path: /Users/Shared/work
          key: jhb-${{ matrix.platform.name }}-49.3
          fail-on-cache-miss: true
      - name: Fix GETTEXT_DIR for macOS
        run: echo "GETTEXT_DIR=/Users/Shared/work/jhb-1.3+meson184" >> $GITHUB_ENV
      - name: Build macOS version
        run: |
          export PATH=/Users/Shared/work/jhb-1.3+meson184/bin:${PATH}
          meson setup -Dprofile=default -Dmacos-app=enabled -Dapp-updater=${{ inputs.appupdater }} --prefix=/ build
          DESTDIR=$PWD/output ninja -C build install
      - name: Codesigning
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.sign == 'true'
        env:
          MACOS_CODESIGN_BASE64: ${{ secrets.MACOS_CODESIGN_BASE64 }}
          MACOS_CODESIGN_NAME: ${{ secrets.MACOS_CODESIGN_NAME }}
          MACOS_CODESIGN_PASSWORD: ${{ secrets.MACOS_CODESIGN_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo $MACOS_CODESIGN_BASE64 | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CODESIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain

          /usr/bin/codesign --force -s "$MACOS_CODESIGN_NAME" --options runtime output/Cartero.app/Contents/MacOS/Cartero -v
          for f in $(find output/Cartero.app -type f -name '*.dylib' -or -name '*.so'); do
            /usr/bin/codesign --force -s "$MACOS_CODESIGN_NAME" --options runtime $f -v
          done
          /usr/bin/codesign --force -s "$MACOS_CODESIGN_NAME" --options runtime output/Cartero.app/Contents/Info.plist -v
          /usr/bin/codesign --force -s "$MACOS_CODESIGN_NAME" --options runtime output/Cartero.app -v
      - name: Notarization
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.sign == 'true'
        env:
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          MACOS_NOTARIZATION_TEAM: ${{ secrets.MACOS_NOTARIZATION_TEAM }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" --apple-id "$MACOS_NOTARIZATION_APPLE_ID" --team-id "$MACOS_NOTARIZATION_TEAM" --password "$MACOS_NOTARIZATION_PASSWORD"
          ditto -c -k --keepParent "output/Cartero.app" "build/Cartero-app.zip"
          xcrun notarytool submit "build/Cartero-app.zip" --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple "output/Cartero.app"
      - name: DMG creation
        run: |
          brew install create-dmg
          create-dmg --volname Cartero --volicon packaging/macos/DmgIcon.icns --window-size 854 480 --background packaging/macos/DmgBackground.png --icon-size 96 --icon Cartero.app 210 225 --app-drop-link 640 225 --eula packaging/COPYING.rtf output/Cartero-${{ needs.tarball.outputs.version }}-macOS-${{ matrix.platform.name }}.dmg output
      - uses: actions/upload-artifact@v4
        name: Upload macOS version
        with:
          name: macos-${{ matrix.platform.name }}
          path: output/*.dmg

  # This is the one that builds the Flatpak package.
  gnulinux-flatpak:
    needs: [tarball]
    strategy:
      matrix:
        platform:
          - runs-on: ubuntu-latest
            name: x86_64
          - runs-on: ubuntu-24.04-arm
            name: aarch64
      fail-fast: false
    runs-on: ${{ matrix.platform.runs-on }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    name: "GNU/Linux Flatpak ${{ matrix.platform.name }}"
    steps:
      - name: Fetch dist
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.tarball.outputs.artifact-id }}
      - name: Extract dist
        run: tar -xf ${{ needs.tarball.outputs.dist }} --strip-components=1
      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Cartero-${{ needs.tarball.outputs.version }}-${{ matrix.platform.name }}.flatpak
          manifest-path: build-aux/es.danirod.Cartero.Devel.json
          cache-key: flatpak-builder-${{ github.sha }}-${{ matrix.platform.name }}
          build-bundle: true
          arch: ${{ matrix.platform.name }}
          upload-artifact: false
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-gnu-flatpak-${{ matrix.platform.name }}
          path: Cartero-*.flatpak

  # This builds the AppImage
  gnulinux-appimage:
    needs: [tarball]
    strategy:
      matrix:
        platform:
          - runs-on: ubuntu-latest
            name: x86_64
          - runs-on: ubuntu-24.04-arm
            name: aarch64
      fail-fast: false
    runs-on: ${{ matrix.platform.runs-on }}
    name: "GNU/Linux AppImage ${{ matrix.platform.name }}"
    steps:
    - name: Fetch dist
      uses: actions/download-artifact@v7
      with:
        artifact-ids: ${{ needs.tarball.outputs.artifact-id }}
    - name: Extract dist
      run: tar -xf ${{ needs.tarball.outputs.dist }} --strip-components=1
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install --no-install-recommends desktop-file-utils gettext libadwaita-1-dev libfuse2 libgtk-4-bin libgtk-4-dev libgtksourceview-5-dev librsvg2-common meson jq
    - name: Build
      run: |
        meson setup build -Dappimage=enabled -Dapp-updater=${{ inputs.appupdater }} -Dprofile=default --prefix=/usr
        ninja -C build
        DESTDIR=$PWD/AppDir ninja -C build install
        curl -LO https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$(uname -m).AppImage
        chmod a+x appimagetool-$(uname -m).AppImage
        VERSION="${{ needs.tarball.outputs.version }}" ./appimagetool-$(uname -m).AppImage AppDir
    - name: Upload
      uses: actions/upload-artifact@v6
      with:
        name: linux-gnu-appimage-${{ matrix.platform.name }}
        path: Cartero-*.AppImage

  # This one builds the Snapcraft package
  gnulinux-snapcraft:
    needs: [tarball]
    strategy:
      matrix:
        platform:
          - runs-on: ubuntu-latest
            name: x86_64
          - runs-on: ubuntu-24.04-arm
            name: aarch64
      fail-fast: false
    runs-on: ${{ matrix.platform.runs-on }}
    name: "GNU/Linux Snap ${{ matrix.platform.name }}"
    steps:
      - name: Fetch dist
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.tarball.outputs.artifact-id }}
      - name: Extract dist
        run: tar -xf ${{ needs.tarball.outputs.dist }} --strip-component=1
      - name: Build Snap
        id: build-snap
        uses: snapcore/action-build@v1
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-gnu-snap-${{ matrix.platform.name }}
          path: ${{ steps.build-snap.outputs.snap }}

  # This one builds the Windows version
  win32:
    needs: [tarball, win32-simplysign]
    strategy:
      matrix:
        platform:
          - runs-on: windows-latest
            name: x64
            msystem: ucrt64
          - runs-on: windows-11-arm
            name: arm64
            msystem: clangarm64
      fail-fast: false
    runs-on: ${{ matrix.platform.runs-on }}
    name: "Win32 ${{ matrix.platform.name }}"
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            git
            zip
          pacboy: >-
            blueprint-compiler
            desktop-file-utils
            gcc
            gettext
            gtk4
            gtksourceview5
            jq
            libadwaita
            librsvg
            libxml2
            meson
            pkgconf
            rust
          msystem: ${{ matrix.platform.msystem }}
      - name: Fetch Simplysign
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.sign == 'true'
        id: cache-simplysign
        uses: actions/cache/restore@v4
        with:
          path: "*.msi"
          key: windows-simplysign-${{ matrix.platform.name }}-9.3.4.72
          fail-on-cache-miss: true
      - name: Install SimplySign
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.sign == 'true'
        shell: pwsh
        run: |
          $AbsoluteInstaller = Convert-Path 'SimplySignDesktop-9.3.4.72-64-bit-en.msi'
          $Installer = Start-Process msiexec -ArgumentList "/i `"$AbsoluteInstaller`" /qn /norestart ALLUSERS=1 /l*v `"$PWD/install.log`"" -Wait -PassThru
          if ($Installer.ExitCode -ne 0 ) {
              Get-Content "$PWD/install.log"
              exit $Installer.ExitCode
          }
      - name: Fetch dist
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.tarball.outputs.artifact-id }}
      - name: Extract dist
        run: tar -xf ${{ needs.tarball.outputs.dist }} --strip-component=1
      - name: Start sign environment
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.sign == 'true'
        env:
          SIGN_USERNAME: ${{ secrets.WINDOWS_SIGN_USERNAME }}
          SIGN_OTP_SECRET: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          python -m venv venv
          venv/bin/pip install pyotp
          venv/bin/python3 .github/scripts/win32-sign.py
      - name: Build Windows version
        run: |
          meson setup build -Dprofile=default -Ddecorations=no-csd -Dwin32-installer=enabled -Dapp-updater=${{ inputs.appupdater }} --prefix=\\
          DESTDIR=$PWD/build/cartero-win32 ninja -C build install
      - name: Sign cartero.exe
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.sign == 'true'
        shell: pwsh
        # Always use the x64 version of signtool.exe, even when running on ARM. SimplySignDesktop
        # is not ARM64 and it seems that there are conflicts when attempting to fetch an x64 cert
        # from an ARM64 program.
        run: |
          $SignTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.DirectoryName -like "*\x64" } | Sort-Object -Descending | Select-Object -First 1
          & $SignTool sign /n "${{ secrets.WINDOWS_SIGN_CERT }}" /tr http://time.certum.pl /td sha256 /fd sha256 build/cartero-win32/bin/cartero.exe
          & $SignTool verify /v /pa build/cartero-win32/bin/cartero.exe
      - uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        name: Create Windows installer
        with:
          path: build/packaging/win32/installer.iss
          options: /DSOURCE_DIR=${{ github.workspace }}/build/cartero-win32 /O+
      - name: Rename Windows installer
        run: mv build/cartero-win32/Output/*.exe build/cartero-${{ needs.tarball.outputs.version }}-windows-${{ matrix.platform.name }}.exe
      - name: Sign installer
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.sign == 'true'
        shell: pwsh
        run: |
          $SignTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.DirectoryName -like "*\x64" } | Sort-Object -Descending | Select-Object -First 1
          & $SignTool sign /n "${{ secrets.WINDOWS_SIGN_CERT }}" /tr http://time.certum.pl /td sha256 /fd sha256 build/cartero-${{ needs.tarball.outputs.version }}-windows-${{ matrix.platform.name }}.exe
          & $SignTool verify /v /pa build/cartero-${{ needs.tarball.outputs.version }}-windows-${{ matrix.platform.name }}.exe
      - uses: actions/upload-artifact@v4
        name: Upload Windows (installer)
        with:
          name: windows-installer-${{ matrix.platform.name }}
          path: build/cartero-${{ needs.tarball.outputs.version }}-windows-${{ matrix.platform.name }}.exe
      - name: Prepare ZIP distribution
        run: |
          cp packaging/win32/COPYING.html $PWD/build/cartero-win32/COPYING.html
          (cd build/cartero-win32 && zip -r cartero-${{ needs.tarball.outputs.version }}-windows-${{ matrix.platform.name }}.zip COPYING.html bin lib share)
      - uses: actions/upload-artifact@v4
        name: Upload Windows (portable)
        with:
          name: windows-portable-${{ matrix.platform.name }}
          path: build/cartero-win32/*.zip
