name: Snapcraft Edge

on:
  workflow_dispatch:
    inputs:
      branch:
        type: choice
        description: The branch to compile and publish
        options:
          - stable
          - beta
jobs:
  publish:
    strategy:
      matrix:
        platform:
          - runs-on: ubuntu-latest
            name: x86_64
          - runs-on: ubuntu-24.04-arm
            name: aarch64
      fail-fast: false
    runs-on: ${{ matrix.platform.runs-on }}
    name: "Release ${{ github.event.inputs.branch}}, ${{ matrix.platform.name }}"
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build-snap
        with:
          path: packaging/snap/latest/${{ github.event.inputs.branch }}/snapcraft.yml
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_LOGIN }}
        with:
          snap: ${{ steps.build-snap.outputs.snap }}
          release: ${{ github.event.inputs.branch }}
