on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
name: Build
jobs:
  flatpak:
    strategy:
      matrix:
        platform:
          - runs-on: ubuntu-latest
            name: x86_64
          - runs-on: ubuntu-24.04-arm
            name: aarch64
      fail-fast: false
    runs-on: ${{ matrix.platform.runs-on }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    name: "Flatpak (${{ matrix.platform.name }})"
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: es.danirod.Cartero.Devel.flatpak
          manifest-path: build-aux/es.danirod.Cartero.Devel.json
          cache-key: flatpak-builder-${{ github.sha }}
          build-bundle: true
          arch: ${{ matrix.platform.name }}
  windows:
    name: "Windows"
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: msys2/setup-msys2@v2
      with:
        update: true
        install: >-
          git
        msystem: ucrt64
    - uses: actions/checkout@v4
    - name: Build Windows version
      run: |
        pacman -Sy --noconfirm pactoys
        pacboy -Sy --noconfirm blueprint-compiler desktop-file-utils gcc gettext gtk4 gtksourceview5 libadwaita librsvg libxml2 meson pkgconf
        export PATH=/c/Users/$USER/.cargo/bin:$PATH
        rustup toolchain install stable-gnu
        rustup default stable-gnu
        meson setup build -Dprofile=development -Dapp-updater=enabled -Ddecorations=no-csd --prefix=\\
        DESTDIR=$PWD/build/cartero-win32 ninja -C build install
    - name: Create Windows installer
      run: |
        "C:\Program Files (x86)\Inno Setup 6\iscc.exe" build/cartero-win32/installer.iss
    - uses: actions/upload-artifact@v4
      name: Upload Windows version
      with:
        name: es.danirod.Cartero-windows-x86_64
        path: |
          build/cartero-win32/bin
          build/cartero-win32/lib
          build/cartero-win32/share
    - uses: actions/upload-artifact@v4
      name: Upload Windows version
      with:
        name: es.danirod.Cartero-windows-x86_64-installer
        path: build/cartero-win32/Output/cartero-*.exe
  macos:
    strategy:
      matrix:
        platform:
          - runs-on: macos-13
            name: x64
          - runs-on: macos-15
            name: arm64
      fail-fast: false
    name: "macOS ${{ matrix.platform.name }}"
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: brew unlink pkg-config && brew install pkg-config meson gtk4 gtksourceview5 desktop-file-utils pygobject3 libadwaita adwaita-icon-theme gettext shared-mime-info && brew link pkgconf
    - name: Fix PYTHONPATH for blueprint-compiler
      run: echo "PYTHONPATH=$(brew --prefix)/lib/python3.13/site-packages:$PYTHONPATH" >> $GITHUB_ENV
    - name: Build macOS version
      run: build-aux/macos-build.sh devel
    - name: Build installer
      run: build-aux/macos-installer.sh
    - uses: actions/upload-artifact@v4
      name: Upload macOS version
      with:
        name: Cartero-${{github.sha }}-macOS-${{ matrix.platform.name }}
        path: build/Cartero-*.dmg
  appimage:
    strategy:
      matrix:
        platform:
          - runs-on: ubuntu-latest
            name: x86_64
          - runs-on: ubuntu-24.04-arm
            name: aarch64
      fail-fast: false
    runs-on: ${{ matrix.platform.runs-on }}
    name: "AppImage (${{ matrix.platform.name }})"
    steps:
    - name: Install Linuxbrew
      run: |
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        test -d ~/.linuxbrew && eval "$(~/.linuxbrew/bin/brew shellenv)"
        test -d /home/linuxbrew/.linuxbrew && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        test -r ~/.bash_profile && echo "eval \"\$($(brew --prefix)/bin/brew shellenv)\"" >> ~/.bash_profile
        echo "eval \"\$($(brew --prefix)/bin/brew shellenv)\"" >> ~/.profile
        echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        sudo apt install --no-install-recommends libfuse2
        brew install meson gtk4 gtksourceview5 desktop-file-utils pygobject3 libadwaita adwaita-icon-theme gettext shared-mime-info
    - uses: actions/checkout@v4
    - name: Build
      run: |
        export VENDOR_BASE="$(brew --prefix)"
        export LD_LIBRARY_PATH="$(brew --prefix)/lib"
        build-aux/appimage-build.sh devel
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: es.danirod.Cartero.Devel-${{ matrix.platform.name }}.AppImage
        path: build/appimagetool/Cartero-${{ matrix.platform.name }}.AppImage
