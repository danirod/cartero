on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
name: Check
jobs:
  # A side quest to upgrade gettext in Ubuntu 26.04
  # Needed because gettext 0.23 does not support Rust.
  # (really, not even gettext 0.24?)
  gettext:
    name: "gettext 1.0"
    runs-on: ubuntu-26.04
    steps:
      - name: check cache
        id: cached-gettext
        uses: actions/cache/restore@v4
        with:
          path: "${{ github.workspace }}/gettext-bin"
          key: check-gettext-1.0
          lookup-only: true
      - name: Compile gettext
        if: ${{ steps.cached-gettext.outputs.cache-hit != 'true' }}
        run: |
          wget https://ftpmirror.gnu.org/gettext/gettext-1.0.tar.xz
          tar -xf gettext-1.0.tar.xz
          cd gettext-1.0
          ./configure --prefix=${{ github.workspace }}/gettext-bin
          make -j$(nproc)
          make install
          ${{ github.workspace }}/gettext-bin/bin/gettext --version
      - name: Cache gettext
        if: ${{ steps.cached-gettext.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ github.workspace }}/gettext-bin"
          key: check-gettext-1.0
  check:
    name: Check
    runs-on: ubuntu-26.04
    needs: [gettext]
    steps:
      - name: dependencies
        run: sudo apt update && sudo apt install -y --no-install-recommends appstream meson libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev desktop-file-utils xvfb
      - name: clone
        uses: actions/checkout@v4
      - name: gettext
        uses: actions/cache/restore@v4
        with:
          path: "${{ github.workspace }}/gettext-bin"
          key: check-gettext-1.0
          fail-on-cache-miss: true
      - name: gettext-path
        run: |
          echo "${{ github.workspace }}/gettext-bin/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=${{ github.workspace }}/gettext-bin/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
      - name: setup
        run: meson setup build
      - name: blueprint
        run: subprojects/blueprint-compiler/blueprint-compiler.py format data/ui
      - name: build
        run: ninja -C build
      - name: linguas in alphabetical order
        run: |
          sed -e '/^\s*#.*/d' -e '/^\s*$/d' < po/LINGUAS | LC_ALL=C sort -c
      - name: update-po-check
        run: |
          MSGDIFF=$(mktemp -d)
          build-aux/check-po.sh > $MSGDIFF/old
          ninja -C build cartero-pot
          ninja -C build cartero-update-po
          build-aux/check-po.sh > $MSGDIFF/new
          diff -u $MSGDIFF/old $MSGDIFF/new && git checkout -- po
      - name: glib-schema
        run: glib-compile-schemas --targetdir build --strict data
      - name: glib-desktop
        run: meson devenv -C build desktop-file-validate data/es.danirod.Cartero.desktop
      - name: glib-appstream
        run: meson devenv -C build appstreamcli validate --no-net data/es.danirod.Cartero.metainfo.xml
      - name: cargo-fmt
        run: meson devenv -C build cargo fmt --manifest-path=../Cargo.toml --check --all
      - name: cargo-test
        run: |
          export GSETTINGS_SCHEMA_DIR=$PWD/build
          xvfb-run meson devenv -C build cargo test --workspace --manifest-path=../Cargo.toml
      - name: cargo-clippy
        run: meson devenv -C build cargo clippy --workspace --manifest-path=../Cargo.toml
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
          arguments: --workspace
  reuse:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check REUSE compliance
        uses: fsfe/reuse-action@v5
  news:
    name: Check NEWS files are properly updated
    runs-on: ubuntu-26.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y --no-install-recommends python3-pip
          pip install --break-system-packages mdformat lxml
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check if news-update.py comes clean
        run: |
          build-aux/news-update.py
          if ! git diff --quiet ; then
            echo "NEWS file is not updated, please run build-aux/news-update.py"
            exit 1
          fi
  flake:
    strategy:
      matrix:
        platform:
          - runs-on: ubuntu-26.04
            name: x86_64
          - runs-on: ubuntu-26.04-arm
            name: aarch64
      fail-fast: false
    runs-on: ${{ matrix.platform.runs-on }}
    name: "Flake (${{ matrix.platform.name }})"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build
      - run: nix flake check
